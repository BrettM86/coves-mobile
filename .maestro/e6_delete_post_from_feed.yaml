# Section E — check 6: delete a post from its home-feed card. Creates its
# own timestamped post (same path as e1), finds it on the Discover feed,
# deletes it from that card's "Post options" menu, and checks the card
# leaves the feed at once, with no pull-to-refresh.
# Only ever deletes the post this flow created: the menu tap is scoped to
# the card whose semantics label carries the unique title, so a miss fails
# the flow instead of opening another card's menu.
# Assumes a signed-in session.
# NOTE: never use hideKeyboard on the compose screen — Maestro implements it
# as a BACK press, which the shell's dirty-draft guard redirects to Home.
appId: social.coves.dev
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Discover feed.*"
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# --- create the post this flow will delete ---
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Create"
      - extendedWaitUntil:
          visible: "Create Post"
          timeout: 15000
- tapOn: "Select a community"
- extendedWaitUntil:
    visible: "Post to"
    timeout: 15000
- tapOn: "Search for a community"
- inputText: "scien"
- extendedWaitUntil:
    visible: "Science[\\s\\S]*"
    timeout: 15000
- tapOn: "Science[\\s\\S]*"
- extendedWaitUntil:
    visible: "Create Post"
    timeout: 15000
- evalScript: ${output.e6Title = 'QA E6 delete ' + Date.now()}
- tapOn: "Title"
- inputText: ${output.e6Title}
- tapOn: "What are your thoughts?"
- inputText: "Created and deleted by the Section E delete-from-feed flow."
- tapOn: "Post"
- extendedWaitUntil:
    visible: "[\\s\\S]*${output.e6Title}[\\s\\S]*"
    timeout: 20000
# --- find it on the home Discover feed (indexing lag absorbed by retries) ---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Discover feed.*"
          timeout: 30000
- retry:
    maxRetries: 4
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
          duration: 400
      - extendedWaitUntil:
          visible: "Feed post in [\\s\\S]*${output.e6Title}[\\s\\S]*"
          timeout: 10000
- scrollUntilVisible:
    element:
      text: "Feed post in [\\s\\S]*${output.e6Title}[\\s\\S]*"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: build/maestro/e6_before_delete
# --- delete from this card's menu only ---
- tapOn:
    text: "Post options"
    childOf:
      text: "Feed post in [\\s\\S]*${output.e6Title}[\\s\\S]*"
- extendedWaitUntil:
    visible: "Delete post"
    timeout: 10000
- tapOn: "Delete post"
- extendedWaitUntil:
    visible: "Delete Post"
    timeout: 10000
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Post deleted"
    timeout: 15000
# The card is gone without a refresh.
- extendedWaitUntil:
    notVisible: "Feed post in [\\s\\S]*${output.e6Title}[\\s\\S]*"
    timeout: 5000
- takeScreenshot: build/maestro/e6_after_delete
