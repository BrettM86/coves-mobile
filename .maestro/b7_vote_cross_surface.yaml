# Section B — check 7 (added round 2): vote state consistency across surfaces.
# Upvote on a post card -> detail shows upvoted; remove the upvote in detail
# -> the card updates.
# Targets the seeded "NASA delays" post. Its card is reached through the
# !science post search rather than the Discover feed, which backend
# integration runs flood with throwaway posts (docs/QA_LOOP.md "Reaching
# fixtures"); the search results are a post-card list like the feed.
appId: social.coves.dev
---
# Cold start can flake on stale semantics when the previous flow ended on
# another screen — retry the launch once (documented quirk).
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Discover feed.*"
          timeout: 30000
- runFlow:
    file: subflows/search_science_posts.yaml
    env:
      QUERY: "NASA delays"
      TITLE: "NASA delays .*Swift telescope.*"
- waitForAnimationToEnd:
    timeout: 3000
# Normalize: if the NASA card is already upvoted, remove the upvote first
- runFlow:
    when:
      visible:
        text: "[\\s\\S]*Remove upvote[\\s\\S]*"
        below: "NASA delays .*Swift telescope.*"
    commands:
      - tapOn:
          text: "[\\s\\S]*Remove upvote[\\s\\S]*"
          below: "NASA delays .*Swift telescope.*"
# Upvote the NASA card in the results list
- tapOn:
    text: "[\\s\\S]*Upvote post[\\s\\S]*"
    below: "NASA delays .*Swift telescope.*"
- assertVisible:
    text: "[\\s\\S]*Remove upvote[\\s\\S]*"
    below: "NASA delays .*Swift telescope.*"
- takeScreenshot: build/maestro/b7_feed_liked
# Open its detail — the upvoted state must carry over
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "NASA delays .*Swift telescope.*"
          index: 0
      - extendedWaitUntil:
          notVisible: "Close search"
          timeout: 15000
- assertVisible: "[\\s\\S]*Remove upvote[\\s\\S]*"
- takeScreenshot: build/maestro/b7_detail_liked_state
# Remove the upvote in detail (index 0 is the post's action bar, above the
# comments)
- tapOn:
    text: "[\\s\\S]*Remove upvote[\\s\\S]*"
    index: 0
- extendedWaitUntil:
    visible: "[\\s\\S]*Upvote post[\\s\\S]*"
    timeout: 10000
# Back to the results — the card must reflect the removed upvote
- back
- extendedWaitUntil:
    visible: "Close search"
    timeout: 15000
- assertVisible: "NASA delays .*Swift telescope.*"
- assertVisible:
    text: "[\\s\\S]*Upvote post[\\s\\S]*"
    below: "NASA delays .*Swift telescope.*"
- takeScreenshot: build/maestro/b7_feed_after_detail_unlike
