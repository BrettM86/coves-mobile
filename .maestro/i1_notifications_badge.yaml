# Section I — check 1: the bell badge appears for the recipient (mari) after
# the second account replies to, mentions and upvotes mari's content, and
# clears once mari opens the Notifications tab.
# PRECONDITIONS: a1_login_session (mari signed in), the local stack's PDS
# (3001) and AppView (8081) reachable from the host, and the second local
# account notifier.local.coves.dev / password, and Jetstream running (see
# QA_LOOP.md Section I).
appId: social.coves.dev
---
- launchApp
- extendedWaitUntil:
    visible: "Discover feed.*"
    timeout: 30000
- runFlow: subflows/seed_notifications.yaml
- takeScreenshot: build/maestro/i1_badge_unread
- tapOn: "Notifications, .* unread"
- extendedWaitUntil:
    visible: "Reply to your post.*${output.seedTag} reply.*"
    timeout: 30000
# Opening the list marks page one seen; leaving the tab refreshes the count.
- tapOn: "Home"
- retry:
    maxRetries: 3
    commands:
      - tapOn: "Me"
      - tapOn: "Home"
      - assertNotVisible: "Notifications, .* unread"
- assertVisible: "Notifications"
- takeScreenshot: build/maestro/i1_badge_cleared
