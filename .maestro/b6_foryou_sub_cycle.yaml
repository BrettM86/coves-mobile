# Section B — check 6 (added round 2): For You populates after subscribing to a
# community with content (science) and drops its posts after unsubscribing
# (the empty state when it was the only subscription). Ends unsubscribed
# from science.
appId: social.coves.dev
---
# Cold start can flake on stale semantics when the previous flow ended on
# another screen — retry the launch once (documented quirk).
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Discover feed.*"
          timeout: 30000
# Open !science from mari's profile, not a Discover post: the Discover
# feed is flooded by backend integration posts (docs/QA_LOOP.md
# "Reaching fixtures").
- runFlow: subflows/open_science_community.yaml
- extendedWaitUntil:
    visible: "[\\s\\S]*Science[\\s\\S]*"
    timeout: 15000
- extendedWaitUntil:
    visible: "Join|Joined"
    timeout: 15000
# Subscribe (normalize: only tap if not already joined)
- runFlow:
    when:
      visible: "Join"
    commands:
      - tapOn: "Join"
- extendedWaitUntil:
    visible: "Joined"
    timeout: 15000
# back returns to mari's profile; go Home for the For You tab
- back
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Discover feed.*"
    timeout: 15000
- tapOn: "For You feed[\\s\\S]*"
# For You must populate (poll refresh to absorb firehose lag)
- retry:
    maxRetries: 4
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
          duration: 400
      - extendedWaitUntil:
          visible: "Feed post in [\\s\\S]*"
          timeout: 10000
- takeScreenshot: build/maestro/b6_foryou_populated
# Unsubscribe via a science post's community chip
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "!science@coves.social"
          index: 0
      - extendedWaitUntil:
          visible: "[\\s\\S]*Science[\\s\\S]*"
          timeout: 15000
- extendedWaitUntil:
    visible: "Joined"
    timeout: 15000
- tapOn: "Joined"
- extendedWaitUntil:
    visible: "Join"
    timeout: 15000
- back
- extendedWaitUntil:
    visible: "Discover feed.*|For You feed[\\s\\S]*"
    timeout: 15000
- tapOn: "For You feed[\\s\\S]*"
# For You must drop the community's posts: the empty state when science was
# the only subscription, otherwise the remaining communities' posts with no
# !science card. mari has also been subscribed to !news since a manual
# walkthrough on 2026-09-10, and this flow doesn't change other
# subscriptions, so it can't assume an empty feed.
- retry:
    maxRetries: 4
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
          duration: 400
      - extendedWaitUntil:
          visible: "No posts yet|Feed post in [\\s\\S]*"
          timeout: 10000
      - assertNotVisible: "!science@coves.social"
- takeScreenshot: build/maestro/b6_foryou_empty_after_unsub
# Leave the app back on Discover
- tapOn: "Discover feed[\\s\\S]*"
- extendedWaitUntil:
    visible: "Feed post in [\\s\\S]*"
    timeout: 15000
