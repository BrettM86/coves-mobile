# Section D — checks 3 + 6: tapping a post card's community handle (on
# mari's profile; the Discover feed is flooded) navigates to that community's
# feed screen; the header (avatar, display
# name, handle, subscriber/member stats), Feed/About tabs, and sort chips all
# render; the About tab shows stats and info. Assumes a signed-in session.
appId: social.coves.dev
---
# Cold start can stall on a blank window or read stale semantics — retry the
# launch once (documented quirk, same pattern as c1/b6/b7).
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Discover feed.*"
          timeout: 30000
# Open !science from mari's profile, not a Discover post: the Discover
# feed is flooded by backend integration posts (docs/QA_LOOP.md
# "Reaching fixtures").
- runFlow: subflows/open_science_community.yaml
- extendedWaitUntil:
    visible: "[\\s\\S]*Science[\\s\\S]*"
    timeout: 15000
- assertVisible: "[\\s\\S]*Subscribers[\\s\\S]*"
- assertVisible: "[\\s\\S]*About[\\s\\S]*"
- assertVisible: "[\\s\\S]*Hot[\\s\\S]*"
# Community feed shows posts from that community. NOTE: the "Feed post in
# ..." semantics label is added by the HOME feed wrapper (feed_page.dart);
# community-feed post cards expose raw merged text, so match a seeded title.
# e1/h1 seed a post into !science every suite run, so the aggregator post
# drifts below the fold — scroll to it instead of asserting in place.
- scrollUntilVisible:
    element:
      text: "[\\s\\S]*NASA delays[\\s\\S]*"
    direction: DOWN
    timeout: 60000
- takeScreenshot: build/maestro/d2_community_feed
# Scroll back up until the Feed/About tab bar is on screen again (a fixed
# number of swipes stops short once more posts sit above NASA)
- scrollUntilVisible:
    element:
      text: "About"
    direction: UP
    timeout: 30000
# About tab: description/stats/info sections render
- tapOn: "About"
- extendedWaitUntil:
    visible: "[\\s\\S]*Community Stats[\\s\\S]*"
    timeout: 10000
- assertVisible: "[\\s\\S]*Visibility[\\s\\S]*"
- takeScreenshot: build/maestro/d2_community_about
# Back to the Feed tab, then leave the community screen
- tapOn: "Feed"
- extendedWaitUntil:
    visible: "[\\s\\S]*Hot[\\s\\S]*"
    timeout: 10000
# back returns to mari's profile
- back
- extendedWaitUntil:
    visible: "Edit Profile"
    timeout: 15000
