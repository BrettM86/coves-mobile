# Section D — check 4: joining a community flips the button state, the
# For You feed reflects the new membership, and leaving reverts both.
# Self-normalizes if a previous run left mari subscribed. Ends with mari
# subscribed to nothing (an assumption baked into b5's comments).
# NOTE: subscriber counts in the header lag the toggle (appview indexes the
# PDS record via the firehose), so this flow asserts button state and feed
# membership effects, not counts.
appId: social.coves.dev
---
# Cold start can stall on a blank window or read stale semantics — retry the
# launch once (documented quirk, same pattern as c1/b6/b7).
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Discover feed.*"
          timeout: 30000
# Open !science from mari's profile, not a Discover post: the Discover
# feed is flooded by backend integration posts (docs/QA_LOOP.md
# "Reaching fixtures").
- runFlow: subflows/open_science_community.yaml
- extendedWaitUntil:
    visible: "[\\s\\S]*Science[\\s\\S]*"
    timeout: 15000
- extendedWaitUntil:
    visible: "Join|Joined"
    timeout: 15000
# Normalize: if a previous run left us subscribed, leave first
- runFlow:
    when:
      visible: "Joined"
    commands:
      - tapOn: "Joined"
      - extendedWaitUntil:
          visible: "Join"
          timeout: 15000
# Join: button flips to Joined
- tapOn: "Join"
- extendedWaitUntil:
    visible: "Joined"
    timeout: 15000
- takeScreenshot: build/maestro/d3_joined
# Membership effect: For You now carries the community's posts.
# Retry with pull-to-refresh to absorb firehose indexing lag.
# back returns to mari's profile; go Home for the For You tab
- back
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Discover feed.*"
    timeout: 15000
- tapOn: "For You feed[\\s\\S]*"
- retry:
    maxRetries: 3
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
          duration: 400
      - extendedWaitUntil:
          visible: "Feed post in [\\s\\S]*"
          timeout: 10000
- takeScreenshot: build/maestro/d3_foryou_member
# Leave: button reverts to Join
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          text: "!science@coves.social"
          index: 0
      - extendedWaitUntil:
          visible: "[\\s\\S]*Science[\\s\\S]*"
          timeout: 15000
- extendedWaitUntil:
    visible: "Joined"
    timeout: 15000
- tapOn: "Joined"
- extendedWaitUntil:
    visible: "Join"
    timeout: 15000
- takeScreenshot: build/maestro/d3_left
- back
- extendedWaitUntil:
    visible: "Discover feed.*|For You feed[\\s\\S]*"
    timeout: 15000
