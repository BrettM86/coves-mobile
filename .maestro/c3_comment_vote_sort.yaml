# Section C — check 6: vote on a comment (optimistic like/unlike) and switch
# the comment sort (Hot -> New).
# Assumes a signed-in session and runs after c2 (which seeds "QA c2 ..."
# comments used to verify the New sort).
appId: social.coves.dev
---
# Cold start can stall on a blank window or read stale semantics — retry the
# launch once (documented quirk, same pattern as c1/b6/b7).
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Discover feed.*"
          timeout: 30000
# Reach the fixture through !science post search, not the flooded Discover
# feed (docs/QA_LOOP.md "Reaching fixtures")
- runFlow:
    file: subflows/open_science_post.yaml
    env:
      QUERY: "NASA delays"
      TITLE: "NASA delays .*Swift telescope.*"
- extendedWaitUntil:
    visible: "NASA delays[\\s\\S]*"
    timeout: 15000
# Jump to the comments section via the action-bar comment count button
- tapOn: "View [0-9]+ comments?[\\s\\S]*"
# --- Comment voting ---
- scrollUntilVisible:
    element:
      text: "[\\s\\S]*Upvote comment[\\s\\S]*"
    direction: DOWN
    timeout: 30000
# Normalize: un-like any comment likes left over from a previous run
- repeat:
    while:
      visible: "[\\s\\S]*Remove upvote[\\s\\S]*"
    commands:
      - tapOn:
          text: "[\\s\\S]*Remove upvote[\\s\\S]*"
          index: 0
- assertNotVisible: "[\\s\\S]*Remove upvote[\\s\\S]*"
# Like the first visible comment — optimistic flip
- tapOn:
    text: "[\\s\\S]*Upvote comment[\\s\\S]*"
    index: 0
- assertVisible: "[\\s\\S]*Remove upvote[\\s\\S]*"
- takeScreenshot: build/maestro/c3_comment_liked
# Un-like again
- tapOn:
    text: "[\\s\\S]*Remove upvote[\\s\\S]*"
    index: 0
- assertNotVisible: "[\\s\\S]*Remove upvote[\\s\\S]*"
# --- Comment sort: Hot -> New ---
- scrollUntilVisible:
    element:
      text: "[0-9]+ Comments?"
    direction: UP
    timeout: 20000
- tapOn: "[0-9]+ Comments?"
- extendedWaitUntil:
    visible: "New"
    timeout: 10000
- tapOn: "New"
# Newest-first: the timestamped QA comments from c2 surface near the top
# (comment-card semantics are merged/multiline, so wrap with [\s\S])
- extendedWaitUntil:
    visible: "[\\s\\S]*QA c2 [\\s\\S]*"
    timeout: 20000
- takeScreenshot: build/maestro/c3_sort_new
- back
