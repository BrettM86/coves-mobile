# Section E — check 10: create an image post end-to-end: pick a community,
# enter a title and a URL, attach 3 images from the gallery through the
# Android photo picker (multi-select), submit; the images upload on Post,
# the optimistic detail shows the 3-image gallery ("1/3") with the link,
# and the post then appears on the home Discover feed (firehose indexing
# lag absorbed with pull-to-refresh retries, as in e1).
# The record on the local PDS must carry an imagesWithAttachment embed with
# 3 blob refs; the device checker reads that from the PDS, not this flow.
# Assumes a signed-in session on the local stack with the uploadImage
# endpoint (coves B1). Title is timestamped so reruns never collide; each
# run uploads 3 blobs and seeds one post (same precedent as e1/h1/f4).
# PREREQUISITE: at least three images must exist in the emulator gallery:
#   adb push e10_image_1.png /sdcard/Pictures/
#   adb push e10_image_2.jpg /sdcard/Pictures/
#   adb push e10_image_3.png /sdcard/Pictures/
#   for f in e10_image_1.png e10_image_2.jpg e10_image_3.png; do
#     adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE \
#       -d file:///sdcard/Pictures/$f
#   done
# NOTE: the composer's add-image control is found by its accessible label
# "Add image"; the Android photo picker's confirm button reads "Add" (with
# the selection count on some picker versions).
# NOTE: never use hideKeyboard on the compose screen — Maestro implements it
# as a BACK press, which the shell's dirty-draft guard redirects to Home.
appId: social.coves.dev
---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Discover feed.*"
          timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Create"
      - extendedWaitUntil:
          visible: "Create Post"
          timeout: 15000
# --- pick community ---
- tapOn: "Select a community"
- extendedWaitUntil:
    visible: "Post to"
    timeout: 15000
- tapOn: "Search for a community"
- inputText: "scien"
- extendedWaitUntil:
    visible: "Science[\\s\\S]*"
    timeout: 15000
- tapOn: "Science[\\s\\S]*"
- extendedWaitUntil:
    visible: "Create Post"
    timeout: 15000
- assertVisible: "Science"
# --- title + URL ---
- evalScript: ${output.e10Title = 'QA E10 image post ' + Date.now()}
- tapOn: "Title"
- inputText: ${output.e10Title}
- tapOn: "URL"
- inputText: "https://example.com/coves-e10-image-post"
# --- attach 3 images from the gallery ---
- tapOn:
    text: "Add image.*"
    index: 0
- extendedWaitUntil:
    visible: "Select Image Source"
    timeout: 15000
- tapOn: "Choose from Gallery[\\s\\S]*"
- extendedWaitUntil:
    visible: "Photo taken on .*"
    timeout: 20000
- takeScreenshot: build/maestro/e10_photo_picker
- tapOn:
    text: "Photo taken on .*"
    index: 0
- tapOn:
    text: "Photo taken on .*"
    index: 1
- tapOn:
    text: "Photo taken on .*"
    index: 2
- tapOn: "Add.*"
# back on Create Post with the strip filled
- extendedWaitUntil:
    visible: "Create Post"
    timeout: 20000
- takeScreenshot: build/maestro/e10_strip
# --- submit: uploads run on Post, then the record is created ---
- tapOn: "Post"
- extendedWaitUntil:
    visible: "[\\s\\S]*${output.e10Title}[\\s\\S]*"
    timeout: 60000
- extendedWaitUntil:
    visible: "1/3"
    timeout: 15000
- takeScreenshot: build/maestro/e10_optimistic_detail
- back
- extendedWaitUntil:
    visible: "Create Post"
    timeout: 15000
- assertVisible: "Select a community"
# --- post shows up on the home Discover feed (eventual consistency) ---
- retry:
    maxRetries: 2
    commands:
      - launchApp:
          stopApp: true
      - extendedWaitUntil:
          visible: "Discover feed.*"
          timeout: 30000
- retry:
    maxRetries: 4
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
          duration: 400
      - extendedWaitUntil:
          visible: "Feed post in [\\s\\S]*${output.e10Title}[\\s\\S]*"
          timeout: 10000
- takeScreenshot: build/maestro/e10_in_feed
