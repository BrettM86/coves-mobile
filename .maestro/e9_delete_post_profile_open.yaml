# Section E — check 9: deleting a post from its Home card also removes it
# from a Me (profile) tab that is already open, with no refresh. Creates its
# own timestamped post (same path as e6), opens the Me tab and brings the
# post on screen there (so the profile posts list holds it), goes back to
# Home, deletes it from that Discover card's "Post options" menu, then
# returns to Me and checks the title is gone.
# Only ever deletes the post this flow created: the menu tap is scoped to
# the card whose semantics label carries the unique title, so a miss fails
# the flow instead of opening another card's menu.
# Assumes a signed-in mari session.
# NOTE: never use hideKeyboard on the compose screen — Maestro implements it
# as a BACK press, which the shell's dirty-draft guard redirects to Home.
appId: social.coves.dev
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Discover feed.*"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# --- create the post this flow will delete ---
- retry:
    maxRetries: 2
    commands:
      - tapOn: "Create"
      - extendedWaitUntil:
          visible: "Create Post"
          timeout: 15000
- tapOn: "Select a community"
- extendedWaitUntil:
    visible: "Post to"
    timeout: 15000
- tapOn: "Search for a community"
- inputText: "scien"
- extendedWaitUntil:
    visible: "Science[\\s\\S]*"
    timeout: 15000
- tapOn: "Science[\\s\\S]*"
- extendedWaitUntil:
    visible: "Create Post"
    timeout: 15000
- evalScript: ${output.e9Title = 'QA E9 delete ' + Date.now()}
- tapOn: "Title"
- inputText: ${output.e9Title}
- tapOn: "What are your thoughts?"
- inputText: "Created and deleted by the Section E delete-with-profile-open flow."
- tapOn: "Post"
- extendedWaitUntil:
    visible: "[\\s\\S]*${output.e9Title}[\\s\\S]*"
    timeout: 20000
# --- open the Me tab first and bring the post on screen there ---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "Discover feed.*"
    timeout: 30000
- tapOn: "Me"
- extendedWaitUntil:
    visible: "[\\s\\S]*@mari.local.coves.dev[\\s\\S]*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "${output.e9Title}"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: build/maestro/e9_profile_before_delete
# --- back on Home, find the Discover card (indexing lag absorbed by retries) ---
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Discover feed.*"
    timeout: 15000
- retry:
    maxRetries: 4
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 80%
          duration: 400
      - extendedWaitUntil:
          visible: "Feed post in [\\s\\S]*${output.e9Title}[\\s\\S]*"
          timeout: 10000
- scrollUntilVisible:
    element:
      text: "Feed post in [\\s\\S]*${output.e9Title}[\\s\\S]*"
    direction: DOWN
    timeout: 30000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: build/maestro/e9_home_before_delete
# --- delete from this card's menu only ---
- tapOn:
    text: "Post options"
    childOf:
      text: "Feed post in [\\s\\S]*${output.e9Title}[\\s\\S]*"
- extendedWaitUntil:
    visible: "Delete post"
    timeout: 10000
- tapOn: "Delete post"
- extendedWaitUntil:
    visible: "Delete Post"
    timeout: 10000
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Post deleted"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Feed post in [\\s\\S]*${output.e9Title}[\\s\\S]*"
    timeout: 5000
# --- the already-open Me tab no longer shows the post ---
# The tab keeps its scroll position (centered on the post), so check there
# first, then scroll to the header to prove this is the profile and check
# again: the post is mari's newest, so it would sit just below the header.
- tapOn: "Me"
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    notVisible: "${output.e9Title}"
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "[\\s\\S]*@mari.local.coves.dev[\\s\\S]*"
    direction: UP
    timeout: 15000
- assertNotVisible: "${output.e9Title}"
- takeScreenshot: build/maestro/e9_profile_after_delete
