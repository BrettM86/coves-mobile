# Section A — checks 2 + 3: OAuth sign-in with the local test account lands
# on the home feed, and the session persists across an app restart.
# PRECONDITIONS: local backend up, `adb reverse` applied for ports
# 3001/3002/8080/8081, legal gates accepted/bypassed, and Chrome first-run
# already dismissed on the emulator. Recovers from a signed-in start by
# signing out first. Leaves the app signed in on the home feed.
appId: social.coves.dev
---
- launchApp
# Wait out the splash screen: either the landing screen (signed out) or the
# feed (signed in) appears
- extendedWaitUntil:
    visible: "Sign in|Discover feed.*"
    timeout: 30000
# Let the semantics tree settle: in suite mode the when-check below
# intermittently read a stale/empty tree right after the splash resolved
# and skipped the sign-out recovery.
- waitForAnimationToEnd:
    timeout: 5000
# Self-recovery: if a previous run left us signed in, sign out first.
# Wrapped in retry so a misfired when-check (stale tree -> recovery
# skipped -> landing screen never appears) re-evaluates instead of
# failing the flow.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: "Discover feed.*|Me"
          commands:
            - tapOn: "Me"
            - extendedWaitUntil:
                visible: "Menu"
                timeout: 15000
            - tapOn: "Menu"
            - tapOn: "Sign Out"
      - extendedWaitUntil:
          visible: "Sign in"
          timeout: 30000
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 15000
# Let the dialog finish animating in: a tap read from a stale tree can land
# on the dialog's own "Sign in" button with an empty handle.
- waitForAnimationToEnd:
    timeout: 5000
# The handle field's label is its hint, plus the validation error once one
# has shown ("alice.bsky.social, Please enter your handle"), so match a
# prefix rather than the exact hint.
- tapOn: "alice\\.bsky\\.social.*"
- inputText: "mari.local.coves.dev"
- hideKeyboard
- tapOn: "Sign in"
# Chrome custom tab: PDS OAuth password page (localhost:3001)
- extendedWaitUntil:
    visible: "Password"
    timeout: 30000
# "Password" matches both the field's label and the input's hint; the input
# is the match nearest the "Make visible" toggle beside it.
- tapOn:
    text: "Password"
    leftOf: "Make visible"
- inputText: "password"
# Submit with the keyboard. "Sign in" matches the page heading, the submit
# button, the WebView and Chrome's title bar, and their tree order changes
# between Chrome versions, so an index-based tap on it is not stable.
- pressKey: Enter
# Consent page
- extendedWaitUntil:
    visible: "Authorize"
    timeout: 30000
- tapOn: "Authorize"
# Check 2: back in the app on the home feed
- extendedWaitUntil:
    visible: "Discover feed.*"
    timeout: 60000
- takeScreenshot: build/maestro/a_login_feed
# Check 3: session persists across a full restart (no re-login)
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Discover feed.*"
    timeout: 30000
- takeScreenshot: build/maestro/a_session_persisted
